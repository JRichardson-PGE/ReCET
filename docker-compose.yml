# The ReCET web app on the example.org server, behind the edge nginx (edge-site deploy/edge), which routes /ReCET to recet:3000.
#
# Before the first start:
#   - the reference data folder is at ~/recet-data (acc/2024, acc/2026 and impact_profiles/; check with
#     `docker compose run --rm recet recet data status`)
#   - the edge stack is running (it creates the "web" network)
# Then:
#   docker compose up -d --build
#   docker compose exec recet recet-web warm-cache --acc 2024      # one ACC at a time, the first time only
#   docker compose exec recet recet-web warm-cache --acc 2026
#   docker compose exec recet recet-web create-admin you@example.com
#
# To try it on your own PC over plain http, set RECET_DATA_DIR to your reference folder, RECET_WEB_SECURE_COOKIES=0, and
# uncomment the ports lines; then open http://localhost:3000/ReCET

services:
  recet:
    image: ${RECET_IMAGE:-recet-web:local}
    build: .
    container_name: recet
    restart: unless-stopped
    environment:
      RECET_WEB_SECURE_COOKIES: ${RECET_WEB_SECURE_COOKIES:-1}
      RECET_WEB_TRUST_PROXY: ${RECET_WEB_TRUST_PROXY:-1}
      RECET_WEB_WORKERS: "1"
      RECET_WEB_ACC_VERSIONS: "2024,2026"
    volumes:
      - ${RECET_DATA_DIR:-~/recet-data}:/data:ro
      - recet_state:/var/lib/recet            # accounts, runs, drafts and the ACC cache
    # Runs hold the ACC cache memory-mapped; keep the container from taking the whole box.
    mem_limit: 1400m
    memswap_limit: 3000m
    stop_grace_period: 15s
    networks:
      - web
    # ports:
    #   - "3000:3000"

networks:
  web:
    external: true

volumes:
  recet_state:
    name: recet_state
