# The ReCET web app on its server, behind a reverse proxy (nginx) that routes /ReCET to recet:3000.
#
# Before the first start:
#   - the reference data folder is at ~/recet-data (acc/2021, acc/2022, acc/2024, acc/2026 and impact_profiles/; check with
#     `docker compose run --rm recet recet data status`)
#   - the edge stack is running (it creates the "web" network)
# Then:
#   docker compose up -d --build
#   docker compose exec recet recet-web warm-cache --acc 2021      # one ACC at a time, the first time only
#   docker compose exec recet recet-web warm-cache --acc 2022
#   docker compose exec recet recet-web warm-cache --acc 2024
#   docker compose exec recet recet-web warm-cache --acc 2026
#   docker compose exec recet recet-web create-admin you@example.com
#
# To try it on your own PC over plain http, set RECET_DATA_DIR to your reference folder, RECET_WEB_SECURE_COOKIES=0, and
# uncomment the ports lines; then open http://localhost:3000/ReCET

services:
  recet:
    image: ${RECET_IMAGE:-recet-web:local}
    build: .
    container_name: recet
    restart: unless-stopped
    environment:
      RECET_WEB_SECURE_COOKIES: ${RECET_WEB_SECURE_COOKIES:-1}
      RECET_WEB_TRUST_PROXY: ${RECET_WEB_TRUST_PROXY:-1}
      RECET_WEB_WORKERS: "1"
      OPENBLAS_NUM_THREADS: "1"               # recet sets this too; here it also covers anything that imports numpy first
      RECET_WEB_ACC_VERSIONS: "2021,2022,2024,2026"
      # run emails (recet/web/notify.py): set these in the server's .env (never in git); with no SMTP host no email is sent
      RECET_WEB_BASE_URL: ${RECET_WEB_BASE_URL:-}
      RECET_WEB_SMTP_HOST: ${RECET_WEB_SMTP_HOST:-}
      RECET_WEB_SMTP_PORT: ${RECET_WEB_SMTP_PORT:-587}
      RECET_WEB_SMTP_SECURITY: ${RECET_WEB_SMTP_SECURITY:-starttls}
      RECET_WEB_SMTP_USER: ${RECET_WEB_SMTP_USER:-}
      RECET_WEB_SMTP_PASSWORD: ${RECET_WEB_SMTP_PASSWORD:-}
      RECET_WEB_SMTP_FROM: ${RECET_WEB_SMTP_FROM:-}
    volumes:
      - ${RECET_DATA_DIR:-~/recet-data}:/data:ro
      - recet_state:/var/lib/recet            # accounts, runs, drafts and the ACC cache
    # Runs hold the ACC cache memory-mapped; keep the container from taking the whole box. 1400m suits a 2 GiB server shared with other apps; on a
    # 4 GiB server set RECET_MEM_LIMIT=3000m (a 1,000,000-row run with 200,000-row parquet groups peaks at about 1.7 GB). On the small box also set
    # RECET_WEB_RUN_DEFAULTS='{"parquet_row_group": 50000}' so parquet output stays within the limit.
    mem_limit: ${RECET_MEM_LIMIT:-1400m}
    memswap_limit: ${RECET_MEMSWAP_LIMIT:-3000m}
    stop_grace_period: 15s
    networks:
      - web
    # ports:
    #   - "3000:3000"

networks:
  web:
    external: true

volumes:
  recet_state:
    name: recet_state
