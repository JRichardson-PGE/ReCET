# Every pull request and every push to main: the test suite (docs tests included) on Python 3.11 and 3.12, and a build of the Docker image.
# The tests need no reference data (tests/conftest.py); the screen-reader walk-through (tests/screenreader) is Windows-only and not run here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,web]"
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recet-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts and answers recet --version
        run: docker run --rm recet-web:ci recet --version
