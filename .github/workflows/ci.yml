# Every pull request and every push to main: the test suite (docs tests included) on Python 3.11 and 3.12, a build of the Docker image
# and a secret scan (gitleaks.toml).
# The tests need no reference data (tests/conftest.py); the screen-reader walk-through (tests/screenreader) is Windows-only and not run here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,web]"
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recet-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts and answers recet --version
        run: docker run --rm recet-web:ci recet --version

  secret-scan:
    # The repository is public: gitleaks (gitleaks.toml: its default rules plus personal emails, Windows user folders, key files,
    # EC2 logins and public IP addresses) over the whole history, and every commit authored and committed under a noreply address.
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 8.21.2
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config gitleaks.toml --redact --no-banner --verbose .
      - name: Commit authors and committers use noreply addresses
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bad=$(git log --format='%ae%n%ce' "$HEAD_SHA" | sort -u | grep -vE '(@users\.noreply\.github\.com|^noreply@github\.com|^noreply@anthropic\.com)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits use an address that is not a noreply address (set git config user.email to your GitHub noreply address):"
            echo "$bad" | sed 's/^\(..\).*@/\1...@/'
            exit 1
          fi
